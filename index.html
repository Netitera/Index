<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netitera Index</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #0d1117;
            color: #e6edf3;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .description {
            margin-top: 8px;
            color: #8b949e;
        }

        #status {
            margin-top: 30px;
            color: #8b949e;
        }

        #sites {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        #sites li {
            margin-bottom: 10px;
        }

        #sites a {
            display: block;
            padding: 12px 16px;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #58a6ff;
            text-decoration: none;
        }

        #sites a:hover {
            background: #161b22;
        }

        .error {
            color: #f85149;
        }

        .empty {
            color: #8b949e;
        }
    </style>
</head>

<body>
    <main>
        <h1>Netitera Index</h1>

        <p class="description">
            Approved sites in the Netitera index.
        </p>

        <div id="status">
            Loading index...
        </div>

        <ul id="sites"></ul>
    </main>

    <script src="./index.js"></script>
</body>
</html>
