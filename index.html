<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Netitera Index</title>

    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            padding: 2rem;
            background: #0d1117;
            color: #e6edf3;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 0.25rem;
        }

        .description {
            color: #8b949e;
            margin-top: 0;
        }

        #status {
            color: #8b949e;
            margin: 2rem 0 1rem;
        }

        #sites {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #sites li {
            margin: 0.5rem 0;
        }

        #sites a {
            display: block;
            padding: 0.9rem 1rem;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #58a6ff;
            text-decoration: none;
            transition: background 0.15s ease;
        }

        #sites a:hover {
            background: #161b22;
        }

        .empty {
            color: #8b949e;
            padding: 1rem 0;
        }

        .error {
            color: #f85149;
        }
    </style>
</head>

<body>
    <main>
        <h1>Netitera Index</h1>

        <p class="description">
            Approved sites in the Netitera index.
        </p>

        <div id="status">Loading index...</div>

        <ul id="sites"></ul>
    </main>

    <script type="module">
        import { getSites } from "./index.js";

        const status = document.getElementById("status");
        const siteList = document.getElementById("sites");

        async function loadIndex() {
            try {
                const sites = await getSites();

                status.textContent =
                    `${sites.length} approved site${sites.length === 1 ? "" : "s"}`;

                if (sites.length === 0) {
                    siteList.innerHTML =
                        '<li class="empty">No approved sites yet.</li>';
                    return;
                }

                for (const site of sites) {
                    const li = document.createElement("li");
                    const a = document.createElement("a");

                    a.href = site.url;
                    a.textContent = site.domain;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";

                    li.appendChild(a);
                    siteList.appendChild(li);
                }
            } catch (error) {
                console.error(error);

                status.textContent =
                    "Failed to load the Netitera index.";

                status.classList.add("error");
            }
        }

        loadIndex();
    </script>
</body>
</html>
